{%- if pagename != "search" %}
<div id="searchbox" style="display: none">
    <form class="form-search margin-top-1em" action="{{ pathto('search') }}" method="get">
        <input id="searchbox" type="search" name="q" style="width: 150px" class="input-small search-query" autocomplete="off" placeholder="Search in this guide"/>
        <input type="hidden" name="check_keywords" value="yes" />
        <input type="hidden" name="area" value="default" />
    </form>
</div>
<script>document.getElementById('searchbox').style.display = "block";</script>
{%- endif %}
